<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Service status</title>
<style>
  :root {
    --bg: #fafafa;
    --card: #ffffff;
    --border: #e4e4e7;
    --text: #18181b;
    --muted: #8a8a92;
  }
  html[data-theme="dark"] {
    --bg: #121212;
    --card: #1b1b1e;
    --border: #2d2d31;
    --text: #e6e6e6;
    --muted: #9a9aa2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 20px 48px;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 24px;
  }
  h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
  a { color: var(--muted); }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #d7263d; }
  .dot.connected { background: #1a7f37; }

  .theme-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    padding: 0;
  }
  .theme-toggle:hover { border-color: var(--muted); }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 20px;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  table + h2 { margin-top: 28px; }
  th, td {
    text-align: left;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
    vertical-align: top;
  }
  tr:last-child th, tr:last-child td { border-bottom: none; }
  th { color: var(--muted); font-weight: 500; width: 45%; }
  pre {
    background: #0b0b0d;
    color: #e4e4e7;
    border-radius: 10px;
    padding: 14px;
    font-size: 0.85rem;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  footer { margin-top: 24px; color: var(--muted); font-size: 0.8rem; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Service status</h1>
    <div class="header-right">
      <span class="status"><span class="dot" id="status-dot"></span><span id="status-text">checking&hellip;</span></span>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">&#9789;</button>
    </div>
  </header>

  <table id="status-table">
    <tbody></tbody>
  </table>

  <h2>Last raw payload</h2>
  <pre id="raw-payload">n/a</pre>

  <footer>
    <a href="/">&larr; back to dashboard</a> &middot; Raw JSON: <a href="/api/service">/api/service</a>
  </footer>
</div>

<script>
const REFRESH_MS = {{ refresh_seconds }} * 1000;

const THEME_KEY = 'weather-theme';
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('theme-toggle').textContent = theme === 'dark' ? '\u2600' : '\u263D';
}
function initTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme(theme);
}
document.getElementById('theme-toggle').addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
});
initTheme();

function fmtTime(iso) {
  if (!iso) return 'n/a';
  try { return new Date(iso).toLocaleString(); } catch (e) { return iso; }
}

function row(label, value) {
  return `<tr><th>${label}</th><td>${value}</td></tr>`;
}

async function refresh() {
  try {
    const res = await fetch('/api/service', { cache: 'no-store' });
    const data = await res.json();

    const dot = document.getElementById('status-dot');
    const text = document.getElementById('status-text');
    const connected = data.status && data.status.connected;
    dot.classList.toggle('connected', !!connected);
    text.textContent = connected ? 'connected' : 'disconnected';

    const rows = [
      row('MQTT connected', connected ? 'yes' : 'no'),
      row('Broker', `${data.broker.host}:${data.broker.port}${data.broker.tls ? ' (TLS)' : ''}`),
      row('Topic', data.broker.topic),
      row('Client ID', data.broker.client_id),
      row('Fields', `temp: <code>${data.fields.temp}</code>, hum: <code>${data.fields.hum}</code>`),
      row('Last connect attempt', fmtTime(data.status.last_connect_attempt)),
      row('Last error', data.status.last_error || 'none'),
      row('Last message received', fmtTime(data.status.last_message_time)),
      row('Last temperature', data.latest ? data.latest.temp.toFixed(1) + ' &deg;C' : 'n/a'),
      row('Last humidity', data.latest ? Math.round(data.latest.hum) + ' %' : 'n/a'),
      row('History entries stored', data.history_count),
      row('History window', data.history_hours + ' h'),
      row('Oldest stored entry', fmtTime(data.oldest_history_timestamp)),
      row('History file', data.data_file),
    ];
    document.querySelector('#status-table tbody').innerHTML = rows.join('');
    document.getElementById('raw-payload').textContent = data.latest ? data.latest.raw : 'n/a';
  } catch (err) {
    console.error('Failed to refresh service status', err);
  }
}

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
