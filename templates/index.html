<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Weather</title>
<style>
  :root {
    --bg: #fafafa;
    --card: #ffffff;
    --border: #e4e4e7;
    --text: #18181b;
    --muted: #8a8a92;
    --red: #d7263d;
    --blue: #2563eb;
    --green: #1a7f37;
    --black: #18181b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 20px 48px;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 28px;
  }
  h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #d7263d; }
  .dot.connected { background: #1a7f37; }

  .readings {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 28px;
  }
  .reading-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    text-align: center;
  }
  .reading-label {
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .reading-value {
    font-size: 3rem;
    font-weight: 700;
    line-height: 1;
  }
  .reading-value .unit { font-size: 1.5rem; font-weight: 500; opacity: 0.7; }

  .charts { display: flex; flex-direction: column; gap: 16px; }
  .chart-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }
  .chart-card h2 {
    font-size: 0.85rem;
    font-weight: 600;
    margin: 0 0 10px 4px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  canvas { width: 100%; height: 180px; display: block; }

  footer {
    margin-top: 28px;
    color: var(--muted);
    font-size: 0.8rem;
    text-align: center;
  }
  footer a { color: var(--muted); }
  .empty { color: var(--muted); font-style: italic; text-align: center; padding: 20px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Weather</h1>
    <span class="status"><span class="dot" id="status-dot"></span><span id="status-text">checking&hellip;</span></span>
  </header>

  <div class="readings">
    <div class="reading-card">
      <div class="reading-label">Temperature</div>
      <div class="reading-value" id="temp-value">&ndash;</div>
    </div>
    <div class="reading-card">
      <div class="reading-label">Humidity</div>
      <div class="reading-value" id="hum-value">&ndash;</div>
    </div>
  </div>

  <div class="charts">
    <div class="chart-card">
      <h2>Temperature &middot; last {{ history_hours|int }}h</h2>
      <canvas id="temp-chart"></canvas>
    </div>
    <div class="chart-card">
      <h2>Humidity &middot; last {{ history_hours|int }}h</h2>
      <canvas id="hum-chart"></canvas>
    </div>
  </div>

  <footer>
    Last update: <span id="last-update">n/a</span> &middot;
    Refreshes every {{ (refresh_seconds / 60)|round(1) }} min &middot;
    <a href="/service">service status</a>
  </footer>
</div>

<script>
const REFRESH_MS = {{ refresh_seconds }} * 1000;
const COLD_BELOW = {{ temp_cold_below }};
const HOT_ABOVE = {{ temp_hot_above }};
const COLORS = { red: '#d7263d', blue: '#2563eb', green: '#1a7f37', black: '#18181b' };

function tempColor(t) {
  if (t > HOT_ABOVE) return COLORS.red;
  if (t < COLD_BELOW) return COLORS.blue;
  return COLORS.green;
}

function drawChart(canvas, points, color, opts) {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const w = rect.width || canvas.clientWidth || 300;
  const h = 180;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  // background coordinate system
  ctx.fillStyle = '#0b0b0d';
  const pad = { l: 36, r: 10, t: 10, b: 20 };
  ctx.fillRect(0, 0, w, h);

  if (!points.length) {
    ctx.fillStyle = '#6b6b70';
    ctx.font = '12px sans-serif';
    ctx.fillText('No data yet', pad.l, h / 2);
    return;
  }

  const values = points.map((p) => p.v);
  let min = Math.min(...values);
  let max = Math.max(...values);
  if (min === max) { min -= 1; max += 1; }
  const margin = (max - min) * 0.1;
  min -= margin;
  max += margin;

  const plotW = w - pad.l - pad.r;
  const plotH = h - pad.t - pad.b;
  const tMin = points[0].t;
  const tMax = points[points.length - 1].t;
  const tSpan = Math.max(tMax - tMin, 1);

  const x = (t) => pad.l + ((t - tMin) / tSpan) * plotW;
  const y = (v) => pad.t + plotH - ((v - min) / (max - min)) * plotH;

  // grid lines + y labels
  ctx.strokeStyle = '#26262a';
  ctx.lineWidth = 1;
  ctx.fillStyle = '#8a8a90';
  ctx.font = '10px sans-serif';
  const steps = 4;
  for (let i = 0; i <= steps; i++) {
    const v = min + ((max - min) * i) / steps;
    const yy = y(v);
    ctx.beginPath();
    ctx.moveTo(pad.l, yy);
    ctx.lineTo(w - pad.r, yy);
    ctx.stroke();
    ctx.fillText(v.toFixed(opts && opts.decimals ? opts.decimals : 0), 2, yy + 3);
  }

  // line
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  points.forEach((p, i) => {
    const px = x(p.t);
    const py = y(p.v);
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  });
  ctx.stroke();
}

function fmtTime(iso) {
  try {
    return new Date(iso).toLocaleString();
  } catch (e) {
    return iso || 'n/a';
  }
}

async function refresh() {
  try {
    const res = await fetch('/api/data', { cache: 'no-store' });
    const data = await res.json();

    const dot = document.getElementById('status-dot');
    const text = document.getElementById('status-text');
    if (data.status && data.status.connected) {
      dot.classList.add('connected');
      text.textContent = 'connected';
    } else {
      dot.classList.remove('connected');
      text.textContent = 'disconnected';
    }

    const tempEl = document.getElementById('temp-value');
    const humEl = document.getElementById('hum-value');
    const latest = data.latest;

    if (latest) {
      tempEl.innerHTML = latest.temp.toFixed(1) + '<span class="unit">&deg;C</span>';
      tempEl.style.color = tempColor(latest.temp);
      humEl.innerHTML = Math.round(latest.hum) + '<span class="unit">%</span>';
      humEl.style.color = COLORS.black;
      document.getElementById('last-update').textContent = fmtTime(latest.timestamp);
    } else {
      tempEl.textContent = '–';
      humEl.textContent = '–';
    }

    const history = data.history || [];
    const tempPoints = history.map((h) => ({ t: new Date(h.timestamp).getTime(), v: h.temp }));
    const humPoints = history.map((h) => ({ t: new Date(h.timestamp).getTime(), v: h.hum }));

    drawChart(document.getElementById('temp-chart'), tempPoints, COLORS.red, { decimals: 1 });
    drawChart(document.getElementById('hum-chart'), humPoints, COLORS.blue, { decimals: 0 });
  } catch (err) {
    console.error('Failed to refresh data', err);
  }
}

refresh();
setInterval(refresh, REFRESH_MS);
window.addEventListener('resize', refresh);
</script>
</body>
</html>
