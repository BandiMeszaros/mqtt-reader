<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Weather</title>
<style>
  :root {
    --bg: #05070a;
    --bg-grid: #0b1018;
    --card: #eef1f5;
    --panel: #10151d;
    --border: #1d2733;
    --text: #18181b;
    --muted: #8a8a92;
    --cyan: #2dd4f0;
    --red: #ff3b5c;
    --blue: #2f8dff;
    --green: #22c55e;
    --black: #18181b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(circle at 15% -10%, rgba(45, 212, 240, 0.12), transparent 45%),
      radial-gradient(circle at 85% 0%, rgba(47, 141, 255, 0.10), transparent 40%),
      linear-gradient(var(--bg-grid) 1px, transparent 1px) 0 0 / 100% 36px,
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px) 0 0 / 36px 100%,
      var(--bg);
    color: #e5e7eb;
    padding: 32px 20px 48px;
    min-height: 100vh;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 28px;
  }
  h1 {
    margin: 0;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #f4f6f8;
  }
  h1::before {
    content: '';
    display: inline-block;
    width: 8px;
    height: 8px;
    margin-right: 10px;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
    border-radius: 1px;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 6px var(--red);
  }
  .dot.connected { background: var(--green); box-shadow: 0 0 6px var(--green); }

  .readings {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 20px;
  }
  .reading-card {
    position: relative;
    background: linear-gradient(180deg, rgba(255,255,255,0.98), var(--card));
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    text-align: center;
    box-shadow: 0 0 0 1px rgba(45, 212, 240, 0.06), 0 10px 30px -14px rgba(0,0,0,0.6);
    overflow: hidden;
  }
  .reading-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent, var(--cyan)), transparent);
    opacity: 0.8;
  }
  .reading-label {
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #71717a;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .reading-value {
    font-family: "SF Mono", "JetBrains Mono", Consolas, monospace;
    font-size: 3rem;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .reading-value .unit { font-size: 1.4rem; font-weight: 500; opacity: 0.6; }

  .charts { display: flex; flex-direction: column; gap: 16px; }
  .chart-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 10px 30px -18px rgba(0,0,0,0.8);
  }
  .chart-card h2 {
    font-size: 0.72rem;
    font-weight: 700;
    margin: 0 0 10px 4px;
    color: #9aa4b2;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }
  .chart-card h2 span.range { color: #5d6774; font-weight: 500; letter-spacing: 0.04em; }
  canvas { width: 100%; height: 200px; display: block; }

  footer {
    margin-top: 28px;
    color: var(--muted);
    font-size: 0.75rem;
    letter-spacing: 0.03em;
    text-align: center;
  }
  footer a { color: var(--cyan); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  .empty { color: var(--muted); font-style: italic; text-align: center; padding: 20px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Weather</h1>
    <span class="status"><span class="dot" id="status-dot"></span><span id="status-text">checking&hellip;</span></span>
  </header>

  <div class="readings">
    <div class="reading-card">
      <div class="reading-label">Temperature</div>
      <div class="reading-value" id="temp-value">&ndash;</div>
    </div>
    <div class="reading-card">
      <div class="reading-label">Humidity</div>
      <div class="reading-value" id="hum-value">&ndash;</div>
    </div>
  </div>

  <div class="charts">
    <div class="chart-card">
      <h2>Temperature <span class="range" id="temp-range-text"></span></h2>
      <canvas id="temp-chart"></canvas>
    </div>
    <div class="chart-card">
      <h2>Humidity <span class="range" id="hum-range-text"></span></h2>
      <canvas id="hum-chart"></canvas>
    </div>
  </div>

  <footer>
    Last update: <span id="last-update">n/a</span> &middot;
    Refreshes every {{ (refresh_seconds / 60)|round(1) }} min &middot;
    <a href="/service">service status</a>
  </footer>
</div>

<script>
const REFRESH_MS = {{ refresh_seconds }} * 1000;
const COLD_BELOW = {{ temp_cold_below }};
const HOT_ABOVE = {{ temp_hot_above }};
const COLORS = { red: '#ff3b5c', blue: '#2f8dff', green: '#22c55e', black: '#18181b' };

function tempColor(t) {
  if (t > HOT_ABOVE) return COLORS.red;
  if (t < COLD_BELOW) return COLORS.blue;
  return COLORS.green;
}

// Picks a "nice" time step (in ms) for x-axis ticks given a span.
const TIME_STEPS = [
  30 * 1000, 60 * 1000, 5 * 60 * 1000, 15 * 60 * 1000, 30 * 60 * 1000,
  60 * 60 * 1000, 3 * 60 * 60 * 1000, 6 * 60 * 60 * 1000, 12 * 60 * 60 * 1000,
  24 * 60 * 60 * 1000,
];

function pickTimeStep(spanMs, targetTicks) {
  const raw = spanMs / targetTicks;
  for (const step of TIME_STEPS) {
    if (step >= raw) return step;
  }
  return TIME_STEPS[TIME_STEPS.length - 1];
}

function fmtTick(ms, spanMs) {
  const d = new Date(ms);
  if (spanMs > 20 * 60 * 60 * 1000) {
    // multi-day range: show date + hour
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) +
      ' ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  }
  return d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}

function rangeLabel(spanMs) {
  if (spanMs <= 0) return '';
  const mins = spanMs / 60000;
  if (mins < 60) return `· last ${Math.max(1, Math.round(mins))}m`;
  const hours = mins / 60;
  if (hours < 48) return `· last ${hours.toFixed(hours < 10 ? 1 : 0)}h`;
  return `· last ${(hours / 24).toFixed(1)}d`;
}

function drawChart(canvas, points, color, opts) {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const w = rect.width || canvas.clientWidth || 300;
  const h = 200;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  // background coordinate system
  const pad = { l: 38, r: 12, t: 12, b: 24 };
  ctx.fillStyle = '#05070a';
  ctx.fillRect(0, 0, w, h);

  if (!points.length) {
    ctx.fillStyle = '#4b5563';
    ctx.font = '12px sans-serif';
    ctx.fillText('No data yet', pad.l, h / 2);
    return;
  }

  const values = points.map((p) => p.v);
  let min = Math.min(...values);
  let max = Math.max(...values);
  if (min === max) { min -= 1; max += 1; }
  const margin = (max - min) * 0.12;
  min -= margin;
  max += margin;

  const plotW = w - pad.l - pad.r;
  const plotH = h - pad.t - pad.b;
  const tMin = points[0].t;
  const tMax = points[points.length - 1].t;
  const tSpan = Math.max(tMax - tMin, 1);

  const x = (t) => pad.l + ((t - tMin) / tSpan) * plotW;
  const y = (v) => pad.t + plotH - ((v - min) / (max - min)) * plotH;

  // horizontal grid lines + y labels
  ctx.strokeStyle = 'rgba(148, 163, 184, 0.12)';
  ctx.lineWidth = 1;
  ctx.fillStyle = '#6b7280';
  ctx.font = '10px monospace';
  const ySteps = 4;
  for (let i = 0; i <= ySteps; i++) {
    const v = min + ((max - min) * i) / ySteps;
    const yy = y(v);
    ctx.beginPath();
    ctx.moveTo(pad.l, yy);
    ctx.lineTo(w - pad.r, yy);
    ctx.stroke();
    ctx.fillText(v.toFixed(opts && opts.decimals ? opts.decimals : 0), 2, yy + 3);
  }

  // dynamic vertical grid lines + x-axis time labels, rescaled to fill the space
  const step = pickTimeStep(tSpan, Math.max(2, Math.floor(plotW / 90)));
  const firstTick = Math.ceil(tMin / step) * step;
  ctx.textAlign = 'center';
  for (let t = firstTick; t <= tMax; t += step) {
    const xx = x(t);
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.08)';
    ctx.beginPath();
    ctx.moveTo(xx, pad.t);
    ctx.lineTo(xx, pad.t + plotH);
    ctx.stroke();
    ctx.fillStyle = '#6b7280';
    ctx.fillText(fmtTick(t, tSpan), xx, h - 6);
  }
  ctx.textAlign = 'left';

  // glow + line
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = 6;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  points.forEach((p, i) => {
    const px = x(p.t);
    const py = y(p.v);
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  });
  ctx.stroke();
  ctx.restore();

  // current value dot
  const last = points[points.length - 1];
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x(last.t), y(last.v), 3, 0, Math.PI * 2);
  ctx.fill();
}

function fmtTime(iso) {
  try {
    return new Date(iso).toLocaleString();
  } catch (e) {
    return iso || 'n/a';
  }
}

async function refresh() {
  try {
    const res = await fetch('/api/data', { cache: 'no-store' });
    const data = await res.json();

    const dot = document.getElementById('status-dot');
    const text = document.getElementById('status-text');
    if (data.status && data.status.connected) {
      dot.classList.add('connected');
      text.textContent = 'connected';
    } else {
      dot.classList.remove('connected');
      text.textContent = 'disconnected';
    }

    const tempEl = document.getElementById('temp-value');
    const humEl = document.getElementById('hum-value');
    const latest = data.latest;

    if (latest) {
      tempEl.innerHTML = latest.temp.toFixed(1) + '<span class="unit">&deg;C</span>';
      tempEl.style.color = tempColor(latest.temp);
      humEl.innerHTML = Math.round(latest.hum) + '<span class="unit">%</span>';
      humEl.style.color = COLORS.black;
      document.getElementById('last-update').textContent = fmtTime(latest.timestamp);
    } else {
      tempEl.textContent = '–';
      humEl.textContent = '–';
    }

    const history = data.history || [];
    const tempPoints = history.map((h) => ({ t: new Date(h.timestamp).getTime(), v: h.temp }));
    const humPoints = history.map((h) => ({ t: new Date(h.timestamp).getTime(), v: h.hum }));

    const spanMs = tempPoints.length > 1 ? (tempPoints[tempPoints.length - 1].t - tempPoints[0].t) : 0;
    const label = rangeLabel(spanMs);
    document.getElementById('temp-range-text').textContent = label;
    document.getElementById('hum-range-text').textContent = label;

    drawChart(document.getElementById('temp-chart'), tempPoints, COLORS.red, { decimals: 1 });
    drawChart(document.getElementById('hum-chart'), humPoints, COLORS.blue, { decimals: 0 });
  } catch (err) {
    console.error('Failed to refresh data', err);
  }
}

refresh();
setInterval(refresh, REFRESH_MS);
window.addEventListener('resize', refresh);
</script>
</body>
</html>
