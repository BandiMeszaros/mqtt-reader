services:
  mqtt-dashboard:
    build: .
    container_name: mqtt-dashboard
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HTTP_PORT: ${HTTP_PORT:-8080}
      DATA_DIR: /app/data
    volumes:
      # Persists the weather history XML file across restarts/deploys.
      - mqtt-dashboard-data:/app/data
    # Direct host-port mapping, same pattern used for filebrowser/transmission
    # in devops/homelab. Do NOT attach a public domain/FQDN to this service
    # in Coolify's "Domains" settings, or it becomes reachable from the
    # internet through Traefik - only reach it via <server-lan-ip>:<HOST_PORT>.
    # HOST_PORT is the port exposed on the host; change it in Coolify's env
    # vars if 8080 is already taken by another service. The app always
    # listens on HTTP_PORT (8080) inside the container.
    ports:
      - "${HOST_PORT:-8080}:${HTTP_PORT:-8080}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mqtt-dashboard-data:
